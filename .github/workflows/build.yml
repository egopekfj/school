name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Чтение кода
      uses: actions/checkout@v4

    - name: Настройка Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Установка PyInstaller
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller

    - name: Сборка EXE
      run: |
        pyinstaller --onefile --noconsole --name "SchoolTestApp" app.py

    - name: Сохранение приложения
      uses: actions/upload-artifact@v4
      with:
        name: SchoolTestApp-Windows
        path: dist/SchoolTestApp.exe
